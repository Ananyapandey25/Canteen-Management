{% extends "base.html" %}
{% block title %}Admin Login - College Canteen{% endblock %}
{% block content %}
<div class="login-wrap">
    <div class="login-card">
        <h1>Admin Login</h1>
        <p class="login-hint">Demo credentials &mdash; username: <strong>admin</strong>, password: <strong>canteen123</strong></p>
        <form action="{{ url_for('admin_login') }}" method="POST" class="login-form">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="admin" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>

            <button type="submit" class="btn btn-primary login-btn">Log In</button>
        </form>
    </div>
</div>
{% endblock %}
